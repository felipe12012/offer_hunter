name: Probe Free Unblock

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: curl_cffi probe
        run: |
          pip install curl_cffi
          python - <<'PY'
          from curl_cffi import requests as creq

          TARGETS = [
              ("nike-vtex-api", "https://www.nike.cl/api/catalog_system/pub/products/search?ft=zapatillas&_from=0&_to=2"),
              ("nike-search", "https://www.nike.cl/_q/zapatillas?map=ft"),
              ("adidas-home", "https://www.adidas.cl/"),
              ("paris-search", "https://www.paris.cl/search?q=zapatillas"),
              ("ripley-search", "https://simple.ripley.cl/search/zapatillas"),
              ("tottus-search", "https://www.tottus.cl/tottus-cl/buscar?Ntt=zapatillas"),
          ]
          for name, url in TARGETS:
              try:
                  r = creq.get(url, impersonate="chrome", timeout=40)
                  body = r.text
                  extra = ""
                  if "api/catalog" in url:
                      try:
                          extra = f" products={len(r.json())}"
                      except Exception:
                          extra = " non-json"
                  marker = "cloudflare-challenge" if ("Attention Required" in body or "Just a moment" in body) else ""
                  print(f"CURL {name} -> {r.status_code}{extra} len={len(body)} {marker}")
              except Exception as e:
                  print(f"CURL {name} -> ERROR {type(e).__name__}: {str(e)[:70]}")
          PY
      - name: patchright probe
        run: |
          pip install patchright
          patchright install chromium >/dev/null 2>&1 || true
          python - <<'PY'
          from patchright.sync_api import sync_playwright

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36")
          TARGETS = [
              ("nike", "https://www.nike.cl/_q/zapatillas?map=ft", "section[class*=product-summary]"),
              ("adidas", "https://www.adidas.cl/", "div[class*=product]"),
              ("paris", "https://www.paris.cl/search?q=zapatillas", '[data-testid="paris-vertical-pod"]'),
          ]
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              for name, url, selector in TARGETS:
                  ctx = browser.new_context(user_agent=UA, viewport={"width": 1366, "height": 768}, locale="es-CL", timezone_id="America/Santiago")
                  page = ctx.new_page()
                  try:
                      resp = page.goto(url, wait_until="domcontentloaded", timeout=45000)
                      page.wait_for_timeout(6000)
                      title = page.title()[:60]
                      cards = page.query_selector_all(selector)
                      print(f"PATCHRIGHT {name} -> status={resp.status if resp else None} title={title!r} cards={len(cards)}")
                  except Exception as e:
                      print(f"PATCHRIGHT {name} -> ERROR {type(e).__name__}: {str(e)[:70]}")
                  finally:
                      ctx.close()
              browser.close()
          PY
