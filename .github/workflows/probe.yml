name: Probe plain HTTP
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe stores with plain HTTP
        run: |
          python3 - <<'PY'
          import urllib.request, re
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36",
               "Accept": "text/html,application/xhtml+xml", "Accept-Language": "es-CL,es;q=0.9"}
          for name, u in [("ripley", "https://simple.ripley.cl/search/notebook"),
                          ("paris", "https://www.paris.cl/search?q=notebook"),
                          ("tottus", "https://www.tottus.cl/tottus-cl/buscar?Ntt=notebook"),
                          ("falabella", "https://www.falabella.com/falabella-cl/search?Ntt=notebook")]:
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=30)
                  t = r.read().decode("utf-8", "replace")
                  title = re.search(r"<title>(.*?)</title>", t, re.S)
                  print(name, r.status, len(t), "NEXT_DATA" if "__NEXT_DATA__" in t else "-", repr(title.group(1)[:60]) if title else None)
              except Exception as e:
                  print(name, "ERR", str(e)[:120])
          PY
