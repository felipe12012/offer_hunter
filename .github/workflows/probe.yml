name: Probe Batch Stores

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        site:
          - https://www.antartica.cl
          - https://contrapunto.cl
          - https://www.buscalibre.cl
          - https://coreanachile.cl
          - https://www.zapatos.cl
          - https://www.kliper.cl
          - https://www.fashionspark.com
          - https://www.ansaldo.cl
          - https://www.reuse.cl
          - https://store.sony.cl
          - https://www.maconline.com
          - https://www.viajesfalabella.cl
          - https://www.iberia.com/cl
          - https://www.outletdelcafe.cl
          - https://www.surprice.cl
          - https://cl.hm.com
          - https://www.wayu.cl
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe ${{ matrix.site }}
        run: |
          pip install requests curl_cffi >/dev/null
          python - <<'PY'
          import os
          import requests
          from curl_cffi import requests as creq
          base = os.environ["SITE"].rstrip("/")
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36", "Accept-Language": "es-CL,es;q=0.9"}
          try:
              r = requests.get(base + "/", headers=UA, timeout=25, allow_redirects=True)
              low = r.text.lower()
              markers = [m for m in ("vtex","shopify","magento","__next_data__","demandware","woocommerce","jumpseller","prestashop","bigcommerce","cloudflare","just a moment","captcha") if m in low]
              print(f"HOME {base} -> {r.status_code} final={r.url[:55]} len={len(r.text)} markers={markers}")
          except Exception as e:
              print(f"HOME {base} -> ERROR {type(e).__name__}")
          for label, path in (
              ("vtex", "/api/catalog_system/pub/products/search?ft=polera&_from=0&_to=2"),
              ("vtexio", "/api/io/_v/api/intelligent-search/product_search/polera?count=3"),
              ("shopify", "/products.json?limit=3"),
              ("woo", "/wp-json/wc/store/v1/products?search=polera&per_page=3"),
          ):
              try:
                  rr = requests.get(base + path, headers=UA, timeout=20)
                  n = ""
                  if rr.status_code == 200:
                      try:
                          data = rr.json()
                          n = f" n={len(data)}" if isinstance(data, (list, dict)) else " non-json"
                      except Exception:
                          n = " non-json"
                  if rr.status_code != 404:
                      print(f"  {label} -> {rr.status_code}{n} len={len(rr.text)}")
              except Exception:
                  pass
          PY
        env:
          SITE: ${{ matrix.site }}
