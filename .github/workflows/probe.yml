name: Probe SFCC Stores

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SFCC discovery
        run: |
          pip install requests beautifulsoup4
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36", "Accept-Language": "es-CL,es;q=0.9"}
          SITES = {"lapolar/abc": "https://www.abc.cl", "tricot": "https://www.tricot.cl"}

          for name, base in SITES.items():
              home = requests.get(base + "/", headers=UA, timeout=25).text
              sites = sorted(set(re.findall(r"Sites-([A-Za-z0-9_-]+)-Site", home)))
              print(f"SITE {name} base={base} site_ids={sites[:5]}")
              candidates = sites + ["%s-Site" % name.split("/")[0], name.split("/")[-1] + "-Site"]
              for sid in dict.fromkeys(candidates):
                  for locale in ("es_CL", "es-CL", "default"):
                      url = f"{base}/on/demandware.store/Sites-{sid}/{locale}/Search-UpdateGrid?q=polera&start=0&sz=48"
                      try:
                          r = requests.get(url, headers=UA, timeout=25)
                      except Exception as e:
                          print(f"   {sid}/{locale} -> ERROR {type(e).__name__}")
                          continue
                      body = r.text
                      soup = BeautifulSoup(body, "html.parser")
                      counts = {sel: len(soup.select(sel)) for sel in (".product-tile", ".product", "[data-pid]", ".grid-tile", "li.product-grid")}
                      print(f"   {sid}/{locale} -> {r.status_code} len={len(body)} {counts}")
                      if any(counts.values()):
                          cards = soup.select(".product-tile") or soup.select("[data-pid]") or soup.select(".product") or soup.select(".grid-tile")
                          first = cards[0]
                          print(f"      first pid={first.get('data-pid')} text={first.get_text(' ', strip=True)[:90]!r}")
                          break
          PY
      - name: Laika discovery
        run: |
          pip install requests
          python - <<'PY'
          import requests
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"}
          for url in ("https://www.laika.cl/", "https://www.laika.cl/tienda", "https://www.laika.cl/shop", "https://laika.com.co/"):
              try:
                  r = requests.get(url, headers=UA, timeout=25, allow_redirects=True)
                  low = r.text.lower()
                  markers = [m for m in ("vtex","shopify","magento","__next_data__","demandware","nuxt","wix","woocommerce") if m in low]
                  print(f"LAIKA {url} -> {r.status_code} final={r.url[:50]} len={len(r.text)} markers={markers} title={r.text[:0]}")
                  i = r.text.lower().find("<title")
                  if i != -1:
                      print("   title:", r.text[i:i+150].split(">",1)[-1].split("<")[0][:80])
              except Exception as e:
                  print(f"LAIKA {url} -> ERROR {type(e).__name__}")
          PY
