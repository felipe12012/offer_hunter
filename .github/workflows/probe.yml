name: Probe Free Proxies

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test free Chilean proxies against blocked stores
        run: |
          pip install requests
          python - <<'PY'
          import requests

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"}

          def fetch_list(url):
              try:
                  r = requests.get(url, headers=UA, timeout=25)
                  if r.status_code == 200:
                      return [ln.strip() for ln in r.text.splitlines() if ln.strip() and ":" in ln]
              except Exception:
                  pass
              return []

          sources = [
              ("proxyscrape-cl-http", "https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http&timeout=5000&country=CL&ssl=all&anonymity=all"),
              ("proxyscrape-cl-socks5", "https://api.proxyscrape.com/v2/?request=displayproxies&protocol=socks5&timeout=5000&country=CL"),
              ("proxyscrape-global-http", "https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http&timeout=3000"),
          ]

          candidates = []
          for name, url in sources:
              got = fetch_list(url)
              print(f"LIST {name} -> {len(got)} proxies")
              candidates.extend(got[:30])

          # de-dup, cap
          seen, pool = set(), []
          for p in candidates:
              if p not in seen:
                  seen.add(p)
                  pool.append(p)
          pool = pool[:60]
          print(f"TESTING {len(pool)} proxies")

          targets = [
              ("adidas", "https://www.adidas.cl/"),
              ("paris", "https://www.paris.cl/search?q=zapatillas"),
              ("nike-api", "https://www.nike.cl/api/catalog_system/pub/products/search?ft=zapatillas&_from=0&_to=1"),
          ]

          live = 0
          for proxy in pool:
              purl = f"http://{proxy}"
              proxies = {"http": purl, "https": purl}
              try:
                  who = requests.get("http://ip-api.com/json", proxies=proxies, timeout=6)
                  info = who.json()
                  if info.get("status") != "success":
                      continue
                  live += 1
                  country = info.get("countryCode")
                  line = [f"LIVE {proxy} country={country}"]
                  for tname, turl in targets:
                      try:
                          rr = requests.get(turl, headers=UA, proxies=proxies, timeout=8)
                          line.append(f"{tname}={rr.status_code}")
                      except Exception:
                          line.append(f"{tname}=ERR")
                  print(" ".join(line))
              except Exception:
                  continue

          print(f"SUMMARY live={live}/{len(pool)}")
          PY
