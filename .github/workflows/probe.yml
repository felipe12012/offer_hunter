name: Probe Tottus Free

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tottus via curl_cffi parse
        run: |
          pip install curl_cffi beautifulsoup4
          python - <<'PY'
          from curl_cffi import requests as creq
          from bs4 import BeautifulSoup

          url = "https://www.tottus.cl/tottus-cl/buscar?Ntt=zapatillas"
          r = creq.get(url, impersonate="chrome", timeout=40)
          print(f"TOTTUS curl status={r.status_code} len={len(r.text)}")
          soup = BeautifulSoup(r.text, "html.parser")
          cards = soup.select('[data-testid="ssr-pod"]')
          links = soup.select('a.pod-link[href]')
          nonempty = [a for a in links if (a.get("href") or "").strip()]
          titles = [a.get("href") for a in nonempty[:3]]
          print(f"cards={len(cards)} pod-links={len(links)} nonempty-href={len(nonempty)}")
          print("sample hrefs:", titles)
          # also inspect the JSON-next shape sometimes embedded
          print("has __NEXT_DATA__:", "__NEXT_DATA__" in r.text)
          PY
      - name: Tottus + Ripley via patchright
        run: |
          pip install patchright
          patchright install chromium >/dev/null 2>&1 || true
          python - <<'PY'
          from patchright.sync_api import sync_playwright

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36")
          TARGETS = [
              ("tottus", "https://www.tottus.cl/tottus-cl/buscar?Ntt=zapatillas", '[data-testid="ssr-pod"]'),
              ("ripley", "https://simple.ripley.cl/search/zapatillas", "a.product-link"),
          ]
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              for name, url, selector in TARGETS:
                  ctx = browser.new_context(user_agent=UA, viewport={"width": 1366, "height": 768}, locale="es-CL", timezone_id="America/Santiago")
                  page = ctx.new_page()
                  try:
                      resp = page.goto(url, wait_until="domcontentloaded", timeout=45000)
                      page.wait_for_timeout(6000)
                      cards = page.query_selector_all(selector)
                      print(f"PATCHRIGHT {name} -> status={resp.status if resp else None} title={page.title()[:55]!r} cards={len(cards)}")
                  except Exception as e:
                      print(f"PATCHRIGHT {name} -> ERROR {type(e).__name__}: {str(e)[:60]}")
                  finally:
                      ctx.close()
              browser.close()
          PY
