name: Probe plain HTTP
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe stores with plain HTTP
        run: |
          python3 - <<'PY'
          import urllib.request, re, json
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36",
               "Accept": "text/html,application/xhtml+xml", "Accept-Language": "es-CL,es;q=0.9"}
          def nd(t):
              m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', t, re.S)
              return json.loads(m.group(1))["props"]["pageProps"] if m else None
          for name, u in [("falabella p1", "https://www.falabella.com/falabella-cl/search?Ntt=notebook"),
                          ("falabella p2", "https://www.falabella.com/falabella-cl/search?Ntt=notebook&page=2"),
                          ("sodimac p1", "https://www.sodimac.cl/sodimac-cl/search?Ntt=taladro"),
                          ("sodimac p2", "https://www.sodimac.cl/sodimac-cl/search?Ntt=taladro&page=2"),
                          ("hites p1", "https://www.hites.com/search?q=notebook&start=0&sz=48"),
                          ("hites p2", "https://www.hites.com/search?q=notebook&start=48&sz=48")]:
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=40)
                  t = r.read().decode("utf-8", "replace")
                  p = nd(t)
                  extra = (len(p["results"]), p["pagination"]) if p else ("tiles", len(re.findall("product-tile", t)))
                  print(name, r.status, len(t), extra)
              except Exception as e:
                  print(name, "ERR", str(e)[:120])
          PY
