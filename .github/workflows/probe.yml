name: Probe Shoe Stores

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run probe
        run: |
          pip install requests
          python - <<'PY'
          import requests

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36",
              "Accept-Language": "es-CL,es;q=0.9",
          }
          DOMAINS = [
              "https://www.adidas.cl",
              "https://www.skechers.cl",
              "https://www.puma.cl",
              "https://www.nike.cl",
              "https://www.asics.cl",
              "https://www.newbalance.cl",
              "https://www.converse.cl",
              "https://www.vans.cl",
              "https://www.reebok.cl",
              "https://www.fila.cl",
              "https://www.topper.cl",
              "https://www.crocs.cl",
              "https://www.merrell.cl",
              "https://www.hoka.cl",
              "https://www.salomon.cl",
              "https://www.payless.cl",
              "https://www.diezz.cl",
              "https://www.hushpuppies.cl",
          ]

          for base in DOMAINS:
              try:
                  r = requests.get(base, headers=HEADERS, timeout=25, allow_redirects=True)
                  body = r.text.lower()
                  markers = [m for m in ("cdn.shopify.com", "vtex", "__next_data__", "magento", "woocommerce", "demandware", "salesforce", "myshopify", "cloudflare", "captcha", "just a moment") if m in body]
                  title = ""
                  i = body.find("<title")
                  if i != -1:
                      title = r.text[i:i+160].split(">", 1)[-1].split("<")[0][:70]
                  print(f"HOME {base} -> {r.status_code} final={r.url} len={len(r.text)} markers={markers} title={title!r}")
              except Exception as e:
                  print(f"HOME {base} -> ERROR {type(e).__name__}")
                  continue

              for label, path in (
                  ("shopify", "/products.json?limit=3"),
                  ("vtex", "/api/catalog_system/pub/products/search?ft=zapatilla&_from=0&_to=2"),
              ):
                  try:
                      rr = requests.get(base + path, headers=HEADERS, timeout=25, allow_redirects=True)
                      extra = ""
                      if rr.status_code == 200 and label == "shopify":
                          try:
                              extra = f" products={len(rr.json().get('products', []))}"
                          except Exception:
                              extra = " non-json"
                      if rr.status_code == 200 and label == "vtex":
                          try:
                              extra = f" products={len(rr.json())}"
                          except Exception:
                              extra = " non-json"
                      print(f"   {label} {base} -> {rr.status_code}{extra} final={rr.url[:80]}")
                  except Exception as e:
                      print(f"   {label} {base} -> ERROR {type(e).__name__}")
          PY
