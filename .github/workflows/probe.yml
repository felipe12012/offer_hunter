name: Probe Laika Mascotas

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dump search page structure
        run: |
          pip install patchright
          patchright install chromium >/dev/null 2>&1 || true
          python - <<'PY'
          from collections import Counter
          from patchright.sync_api import sync_playwright
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              ctx = browser.new_context(user_agent=UA, viewport={"width":1366,"height":900}, locale="es-CL", timezone_id="America/Santiago")
              page = ctx.new_page()
              page.goto("https://www.laikamascotas.cl/listados?q=alimento%20perro", wait_until="domcontentloaded", timeout=45000)
              page.wait_for_timeout(9000)
              print("URL", page.url, "title", page.title()[:60], "len", len(page.content()))
              anchors = page.eval_on_selector_all("a[href]", "els => els.map(e => [e.getAttribute('href'), (e.innerText||'').trim().replace(/\\s+/g,' ')].filter(x=>x[0]))")
              hrefs = [a[0] for a in anchors]
              print("anchor count", len(anchors))
              print("sample hrefs:", hrefs[:15])
              # elements whose own text looks like a CLP price
              priced = page.eval_on_selector_all("*", "els => els.filter(e => e.children.length===0 && /\\$\\s?\\d{1,3}(\\.\\d{3})+/.test(e.textContent||'')).slice(0,10).map(e => [e.tagName, e.className, (e.textContent||'').trim().slice(0,40)])")
              print("priced leaf samples:", priced)
              classes = page.eval_on_selector_all("*", "els => els.map(e => e.className).filter(c => typeof c==='string' && /product|card|item|listado|grid|precio|price/i.test(c))")
              top = Counter()
              for c in classes:
                  for token in str(c).split():
                      top[token] += 1
              print("candidate classes:", top.most_common(20))
              ctx.close(); browser.close()
          PY
