name: Probe Blocked Shoe Brands

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: pip install playwright && playwright install --with-deps chromium
      - name: Run browser probe
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36")
          DOMAINS = [
              "https://www.adidas.cl",
              "https://www.nike.cl",
              "https://www.converse.cl",
              "https://www.fila.cl",
              "https://www.skechers.cl",
              "https://www.puma.cl",
              "https://www.newbalance.cl",
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              for base in DOMAINS:
                  context = browser.new_context(
                      user_agent=UA, viewport={"width": 1366, "height": 768},
                      locale="es-CL", timezone_id="America/Santiago",
                  )
                  page = context.new_page()
                  try:
                      resp = page.goto(base, wait_until="domcontentloaded", timeout=45000)
                      status = resp.status if resp else None
                      page.wait_for_timeout(4000)
                      title = page.title()[:70]
                      html = page.content()
                      low = html.lower()
                      markers = [m for m in ("just a moment", "captcha", "access denied", "403", "robot", "verify you are human") if m in low]
                      print(f"BROWSER {base} -> status={status} final={page.url[:60]} len={len(html)} title={title!r} markers={markers}")
                  except Exception as e:
                      print(f"BROWSER {base} -> ERROR {type(e).__name__}: {str(e)[:80]}")
                  finally:
                      context.close()
              browser.close()
          PY
