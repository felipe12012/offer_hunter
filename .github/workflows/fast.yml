name: Fast Tier Deal Scan

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      migrate:
        description: "One time: import data/*.json into Supabase before the scan (safe to re-run)"
        type: boolean
        default: false
      selftest:
        description: "Send 3 real scraped products to Telegram as test messages (no state changes)"
        type: boolean
        default: false

permissions:
  contents: write

# One scan at a time. A run lasts ~6 minutes and the cron fires every 15, but a
# delayed or manually dispatched run can overlap the next one; two runs both
# commit data/ and the second `git push` is rejected, failing the workflow.
# Keeping the in-flight run and dropping the queued duplicate avoids that.
concurrency:
  group: fast-tier-scan
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    environment: env
    # Hard ceiling. A single hung scraper must not hold the concurrency lock for
    # hours; main_fast also caps each store individually, this is the backstop.
    # Raised from 20: a Cyber run sends up to ~150 messages (about 2 s each) after a ~10 minute scan.
    timeout-minutes: 30
    steps:
      # Check out the branch tip, not the commit that existed when the run was
      # triggered. A run queued behind another (see `concurrency`) would
      # otherwise start from stale data/, re-send offers the previous run just
      # delivered, and then fail to push because main moved on.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Fast tier is HTTP-only (Sodimac, Falabella, Hites, the Shopify/VTEX/HTML
      # stores). The browser stores run in browser.yml on their own schedule, so
      # no Chromium is installed here and a scan stays well under 15 minutes.

      - name: Import JSON state into Supabase
        if: ${{ inputs.migrate == true }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python migrate_to_supabase.py

      - name: Run pipeline
        env:
          # HTTP-only tier: skip the browser stores (they run in browser.yml).
          SCAN_TIER: http
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional second destination for big discounts (alerts.alert_chat_min_pct)
          # and, for a supergroup with topics, the topic id. Unset = all offers
          # go to TELEGRAM_CHAT_ID.
          # Optional. When both are set, every scan is also written to Supabase
          # (supabase_sync.py). Unset = JSON files only.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          TELEGRAM_ALERT_THREAD_ID: ${{ secrets.TELEGRAM_ALERT_THREAD_ID }}
          # Optional public channel: gets a copy of every delivered offer.
          TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
          # Optional. Paris, Ripley and Tottus block GitHub's datacenter IPs with
          # a WAF/CloudFront 403, so they only scrape when the browser is routed
          # through a clean (ideally Chilean residential) proxy. Format:
          # http://user:pass@host:port  Leave unset to run the other stores directly.
          SCRAPER_PROXY: ${{ secrets.SCRAPER_PROXY }}
        run: python main_fast.py ${{ inputs.selftest && '--selftest' || '' }}

      - name: Commit updated data files
        run: |
          git config user.name "cyberday-hunter"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen_items.json data/price_history.json data/alert_budget.json
          git diff --cached --quiet || git commit -m "chore: update seen items and price history"
          # Rebase onto whatever landed while this run was scanning (another
          # run, or a manual push). Without this the push is rejected and the
          # whole workflow is marked failed even though the scan succeeded.
          git pull --rebase origin main
          git push

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # main_fast.py leaves the reason in run_status.txt when it knows why it failed.
          reason="$(head -c 400 run_status.txt 2>/dev/null || true)"
          header="⚠️ cyberday-hunter (fast tier): el pipeline falló."
          logs="Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$reason" ]; then
            text="$(printf '%s\n%s\n%s' "$header" "Motivo: $reason" "$logs")"
          else
            text="$(printf '%s\n%s' "$header" "$logs")"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}"
