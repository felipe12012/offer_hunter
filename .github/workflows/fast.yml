name: Fast Tier Deal Scan

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      selftest:
        description: "Send 3 real scraped products to Telegram as test messages (no state changes)"
        type: boolean
        default: false

permissions:
  contents: write

# One scan at a time. A run lasts ~6 minutes and the cron fires every 15, but a
# delayed or manually dispatched run can overlap the next one; two runs both
# commit data/ and the second `git push` is rejected, failing the workflow.
# Keeping the in-flight run and dropping the queued duplicate avoids that.
concurrency:
  group: fast-tier-scan
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    environment: env
    steps:
      # Check out the branch tip, not the commit that existed when the run was
      # triggered. A run queued behind another (see `concurrency`) would
      # otherwise start from stale data/, re-send offers the previous run just
      # delivered, and then fail to push because main moved on.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Falabella, Sodimac and Hites are read over plain HTTP. Chromium (~4 min
      # to install) is only needed by Paris/Ripley/Tottus, which are paused in
      # config/watchlist.json. Set repo variable INSTALL_BROWSER=true to re-enable.
      - name: Install Playwright chromium
        if: ${{ vars.INSTALL_BROWSER == 'true' }}
        run: playwright install --with-deps chromium

      - name: Run pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional. Paris, Ripley and Tottus block GitHub's datacenter IPs with
          # a WAF/CloudFront 403, so they only scrape when the browser is routed
          # through a clean (ideally Chilean residential) proxy. Format:
          # http://user:pass@host:port  Leave unset to run the other stores directly.
          SCRAPER_PROXY: ${{ secrets.SCRAPER_PROXY }}
        run: python main_fast.py ${{ inputs.selftest && '--selftest' || '' }}

      - name: Commit updated data files
        run: |
          git config user.name "cyberday-hunter"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen_items.json data/price_history.json
          git diff --cached --quiet || git commit -m "chore: update seen items and price history"
          # Rebase onto whatever landed while this run was scanning (another
          # run, or a manual push). Without this the push is rejected and the
          # whole workflow is marked failed even though the scan succeeded.
          git pull --rebase origin main
          git push

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ cyberday-hunter (fast tier): el pipeline falló. Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
