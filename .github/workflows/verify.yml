name: Verify Offers

# Opens the product page of the offers people see (Falabella and Sodimac) and records whether the store still sells
# them (verify_offers.py). Sold-out ones are hidden from the web's lists and marked on their page. No state files.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-offers
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: env
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python verify_offers.py
